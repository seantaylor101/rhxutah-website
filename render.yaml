services:
  - type: web
    name: rhx-lead-tracker
    runtime: docker
    plan: starter
    dockerfilePath: ./lead-tracker/Dockerfile
    dockerContext: ./lead-tracker
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_PATH
        value: /app/data/leads.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FORM_INTAKE_KEY
        sync: false
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
    disk:
      name: rhx-lead-tracker-data
      mountPath: /app/data
      sizeGB: 1
